name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Swift build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            macos/.build
            macos/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Show Swift toolchain
        working-directory: macos
        run: swift --version

      - name: Resolve dependencies
        working-directory: macos
        run: swift package resolve

      - name: Build (debug)
        working-directory: macos
        run: swift build

      - name: Build (release)
        working-directory: macos
        run: swift build -c release

      - name: Build site subproject (Astro, smoke test)
        # 真正的部署走 Vercel 的 GitHub integration（Vercel dashboard 里把项目 link 到这个 repo，
        # push main 时 Vercel 自己会 build + deploy + 绑 quotabar.ddonlien.com）。这里的 npm run
        # build 只是提前抓 site/ 的构建错误（marketing 主页破图不能等到 Vercel 才暴露）。
        working-directory: site
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          fi

  release:
    name: Package .dmg + GitHub Release
    needs: build
    # 2026-07-07 改版：不再区分 nightly/stable 两条通道，push main 和手动触发
    # 都走同一条路径——版本号来自仓库根目录的 VERSION 文件（Agent 维护），
    # tag 统一是 v<VERSION>-<git-short-sha>。
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            macos/.build
            macos/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build .app via build-app.sh
        working-directory: macos
        env:
          APP_NAME: QuotaBar
        run: ./scripts/build-app.sh

      - name: Compute release tag
        id: version
        run: |
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "tag=v${BASE_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build .dmg
        env:
          APP_NAME: QuotaBar
          APP_BUNDLE_NAME: Quota Bar
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # build-app.sh 输出到 checkout 父目录下的 _builds/latest（跟本地"main + 平级
          # worktree 目录"布局一致的约定），不是仓库内部的 macos/build/latest——
          # 后者是重构前的旧路径，CI 一直没跟着更新，导致 release 一直在这一步失败。
          APP="$(dirname "$GITHUB_WORKSPACE")/_builds/latest/${APP_BUNDLE_NAME}.app"
          test -d "$APP" || { echo "build-app.sh did not produce $APP"; exit 1; }
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="$RUNNER_TEMP/${APP_NAME}-${TAG}.dmg"
          hdiutil create \
            -volname "Quota Bar" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          ls -lh "$DMG"

      # v0.15.0 发布链路迁移：安装包托管到 Vercel Blob，GitHub Release 只留 tag +
      # 源码归档。
      #
      # `if: env.BLOB_READ_WRITE_TOKEN != ''` 是有意的兼容闸门——token 配好之前，
      # 这一步整个跳过，下面两步会退回旧的"dmg 挂 GitHub Release"路径。这样这次
      # 迁移的代码可以先合进 main 而不会把发版打断，等 token 配好后自动切换。
      # 单独一步探测：步骤级 `if:` 读不到同一步骤 `env:` 块里定义的变量，
      # 必须先把"有没有配 token"变成一个 step output 才能被后面的 if 使用。
      - name: Check Vercel Blob configuration
        id: blobcfg
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BLOB_READ_WRITE_TOKEN 未配置，本次沿用旧路径把 dmg 挂到 GitHub Release"
          fi

      - name: Upload dmg + manifest to Vercel Blob
        id: blob
        if: steps.blobcfg.outputs.configured == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          NOTES="$RUNNER_TEMP/release-notes.txt"
          cat > "$NOTES" <<'NOTE'
          Automated build from this commit. Install: open the dmg and drag Quota Bar into Applications.
          First launch requires right-click → Open (unsigned / not notarized; Developer ID signing lands in v0.12.0).
          NOTE
          npm install --no-save @vercel/blob
          node scripts/upload-release.mjs "$DMG" "$TAG" "$BASE_VERSION" "$NOTES"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # 迁移完成后的常态：Release 不带任何构建产物，只作为 tag + 源码归档的载体。
      - name: Create GitHub Release (source only)
        if: steps.blob.outputs.uploaded == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Quota Bar ${{ steps.version.outputs.tag }}
          body: |
            Automated build from `${{ github.sha }}`.

            **下载安装包**：<https://quotabar.ddonlien.com/>

            安装包不再作为 Release 附件分发，改为托管在官网（Vercel Blob）。
            本 Release 只保留 tag 与源码归档；源码始终开源，可自行编译。
          draft: false
          prerelease: false

      # 兼容路径：BLOB_READ_WRITE_TOKEN 尚未配置时沿用旧行为，保证发版不中断。
      - name: Create GitHub Release (with dmg — legacy fallback)
        if: steps.blob.outputs.uploaded != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Quota Bar ${{ steps.version.outputs.tag }}
          body: |
            Automated build from `${{ github.sha }}`.

            **Install**

            1. Download `QuotaBar-${{ steps.version.outputs.tag }}.dmg` below.
            2. Open it (double-click).
            3. Drag **Quota Bar** into **Applications** — or just double-click it inside the DMG window to run from there.

            > First launch requires right-click → Open. The binary is unsigned and not notarized (v0.12.0 will add Developer ID + notarization).
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ env.DMG }}
